<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gala Reactch - Vercel Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(circle at top right, #064e3b, transparent), radial-gradient(circle at bottom left, #020617, transparent);
        }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-md mx-auto mt-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-500/20 rounded-2xl mb-4 border border-green-500/30">
                <i class="fa-solid fa-bolt-lightning text-green-400 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight italic uppercase">Reactch <span class="text-green-500">Vercel</span></h1>
            <p class="text-slate-400 text-sm mt-2">Panel Suntik Reaksi v2.0 • Ultra Stealth</p>
        </div>

        <!-- Main Form -->
        <div class="glass p-6 rounded-3xl shadow-2xl space-y-5">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 mb-2 ml-1">Target Link</label>
                <div class="relative">
                    <i class="fa-solid fa-link absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input id="link" type="text" placeholder="https://whatsapp.com/channel/..." 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-green-500 focus:outline-none transition-all placeholder:text-slate-700 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 mb-2 ml-1">Emoji Reaksi</label>
                <div class="relative">
                    <i class="fa-solid fa-face-smile absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input id="emoji" type="text" value="🗿,🔥,😹" 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-green-500 focus:outline-none transition-all text-sm">
                </div>
            </div>

            <button id="submitBtn" onclick="runAction()" 
                class="w-full py-4 bg-green-600 hover:bg-green-500 text-white font-black rounded-xl transition-all active:scale-95 btn-glow flex items-center justify-center gap-3">
                <i class="fa-solid fa-paper-plane"></i>
                <span>SUNTIK SEKARANG</span>
            </button>
        </div>

        <!-- Console Log -->
        <div class="mt-6 glass rounded-2xl overflow-hidden border border-slate-800">
            <div class="bg-slate-900/50 px-4 py-2 border-b border-slate-800 flex justify-between items-center">
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">System Log</span>
                <div class="flex gap-1.5">
                    <div class="w-2 h-2 rounded-full bg-red-500/50"></div>
                    <div class="w-2 h-2 rounded-full bg-yellow-500/50"></div>
                    <div class="w-2 h-2 rounded-full bg-green-500/50"></div>
                </div>
            </div>
            <div id="logs" class="log-container h-40 p-4 font-mono text-[11px] space-y-1 overflow-y-auto">
                <div class="text-slate-600">> System Ready...</div>
            </div>
        </div>

        <footer class="mt-8 text-center">
            <p class="text-[9px] text-slate-600 uppercase tracking-[0.3em]">Modified for GALA • 2026</p>
        </footer>
    </div>

    <script>
        const SERVERS = [
            "https://project.nexasmm.my.id/react/",
            "https://nexapanel.my.id/react2/"
        ];

        function addLog(msg, color = 'text-slate-400') {
            const container = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = color;
            entry.innerHTML = `<span class="text-slate-700">[${new Date().toLocaleTimeString()}]</span> > ${msg}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        async function runAction() {
            const link = document.getElementById('link').value.trim();
            const emoji = document.getElementById('emoji').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!link) return addLog("Gagal: Link target kosong!", "text-red-400");

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> <span>MENGIRIM...</span>`;
            
            addLog(`Memulai injeksi ke target...`, "text-yellow-500");

            let done = false;
            for (let i = 0; i < SERVERS.length; i++) {
                addLog(`Menghubungi S${i+1}: ${SERVERS[i].split('/')[2]}...`);
                
                try {
                    const formData = new URLSearchParams();
                    formData.append('link', link);
                    formData.append('emoji', emoji);
                    formData.append('execute', '');

                    // Menggunakan fetch mode no-cors untuk bypass dasar
                    await fetch(SERVERS[i], {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors'
                    });

                    addLog(`Berhasil: Server ${i+1} menerima request!`, "text-green-400");
                    done = true;
                } catch (e) {
                    addLog(`Error S${i+1}: ${e.message}`, "text-red-400");
                }
                
                // Jeda antar server
                await new Promise(r => setTimeout(r, 2000));
            }

            if (done) addLog("Eksekusi Selesai. Cek link target!", "text-green-500 font-bold");
            
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>SUNTIK SEKARANG</span>`;
        }
    </script>
</body>
</html>
